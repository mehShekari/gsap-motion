name: Release to npm

# Publishes packages/cli and packages/eslint-plugin when a GitHub Release is
# published. The two share one version, so they are released together.
#
# It uses npm trusted publishing: npm verifies this workflow run through OIDC,
# so no npm token is stored in the repository, and every version carries
# provenance linking it to the commit and run that built it. The trusted
# publisher (this repository and release.yml) must be configured on each
# package's settings page on npmjs.com first.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm.
      - run: npm install --global npm@latest

      - name: The release tag matches both package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          CLI="v$(node -p "require('./packages/cli/package.json').version")"
          PLUGIN="v$(node -p "require('./packages/eslint-plugin/package.json').version")"
          if [ "$TAG" != "$CLI" ] || [ "$TAG" != "$PLUGIN" ]; then
            echo "Release tag $TAG does not match the packages: cli $CLI, eslint-plugin $PLUGIN"
            exit 1
          fi

      - run: node scripts/test.mjs
      - run: node packages/cli/scripts/check-pack.mjs

      - run: npm ci
        working-directory: packages/eslint-plugin
      - run: npm test
        working-directory: packages/eslint-plugin
      - run: node scripts/check-pack.mjs
        working-directory: packages/eslint-plugin

      - run: npm publish --provenance --access public
        working-directory: packages/cli
      - run: npm publish --provenance --access public
        working-directory: packages/eslint-plugin
