name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skill's `compatibility` promises Node 18+ for its scripts.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/test.mjs

  spec:
    name: Agent Skills specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install skills-ref
      - run: agentskills validate plugins/gsap-motion/skills/gsap-creative-animation

  plugin:
    name: Plugin and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate plugins/gsap-motion --strict
      - run: claude plugin validate . --strict

  example:
    name: Example app builds and passes the audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace examples/next-app
      - run: npm run build --workspace examples/next-app
      - run: npm run audit:example -- --quiet

  vendor:
    name: Vendored parser matches its pinned sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/vendor-parser.mjs --check

  package:
    name: npm package, as users download it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node packages/cli/scripts/check-pack.mjs

  eslint:
    name: ESLint plugin · ESLint ${{ matrix.eslint }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest ESLint the plugin supports, on the oldest Node it runs on.
          - eslint: 9
            node: 22
          - eslint: 10
            node: 24
    defaults:
      run:
        working-directory: packages/eslint-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/eslint-plugin/package-lock.json
      - run: npm ci
      - if: matrix.eslint == 9
        run: npm install --no-save eslint@9
      - run: npm test
      # Installs the packed plugin, and ESLint from the registry, into an empty project.
      - if: matrix.eslint == 10
        run: node scripts/check-pack.mjs
